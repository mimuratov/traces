<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traces — Прототип</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    /* Layout: телефон по центру сцены */
    :root{
      --paper:#E9EFEC; --surface:#FFFFFF; --surface-2:#F2F5F3; --surface-3:#E6ECE9;
      --ink:#13202A; --muted:#5B6971; --line:#DCE3DF; --bezel:#13202A;
      --accent:#2D55F5; --accent-soft:#E3E9FF; --on-accent:#FFFFFF;
      --sun:#F5A400; --sun-soft:#FFF1D1; --mint:#0F9B72; --mint-soft:#DAF3EA; --danger:#D9443A;
      --map-land:#EEF1EC; --map-block:#E1E6E0; --map-road:#FFFFFF; --map-water:#BFD8EA; --map-park:#CFE6C8; --map-label:#8A979E;
      --shadow:0 1px 2px rgba(19,32,42,.06),0 8px 24px rgba(19,32,42,.08);
      --f-display:"Unbounded","Manrope",system-ui,sans-serif;
      --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
      --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    }
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
      --paper:#0B1115; --surface:#131B21; --surface-2:#1A242B; --surface-3:#22303A; --ink:#E7EDF0; --muted:#8D9BA3; --line:#26333C; --bezel:#2A3740;
      --accent:#7A93FF; --accent-soft:#1F2A55; --on-accent:#0B1115; --sun:#FFC23D; --sun-soft:#3A2D10; --mint:#3DCB9C; --mint-soft:#123329; --danger:#FF7468;
      --map-land:#172026; --map-block:#1E2930; --map-road:#2A3741; --map-water:#1B3447; --map-park:#1C3427; --map-label:#6F7E86;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
    :root[data-theme="dark"]{
      --paper:#0B1115; --surface:#131B21; --surface-2:#1A242B; --surface-3:#22303A; --ink:#E7EDF0; --muted:#8D9BA3; --line:#26333C; --bezel:#2A3740;
      --accent:#7A93FF; --accent-soft:#1F2A55; --on-accent:#0B1115; --sun:#FFC23D; --sun-soft:#3A2D10; --mint:#3DCB9C; --mint-soft:#123329; --danger:#FF7468;
      --map-land:#172026; --map-block:#1E2930; --map-road:#2A3741; --map-water:#1B3447; --map-park:#1C3427; --map-label:#6F7E86;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{height:100%}
    body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
    input,textarea{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .stage{min-height:100%;display:flex;justify-content:center;align-items:center;padding:24px}

    /* ---------- device ---------- */
    .device{
  position:relative;
  width:390px;
  height:844px;
  min-height:0;
  border:10px solid var(--bezel);
  border-radius:52px;
  background:var(--surface);
  box-shadow:0 30px 80px rgba(19,32,42,.25);
  overflow:hidden;
  flex:none;
  transform-origin:center center;
}
    .app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
    .statusbar{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
    .statusbar .icons{display:flex;gap:6px;align-items:center}
    .statusbar .icons i{display:block;background:var(--ink);border-radius:2px}
    .screen-wrap{position:relative;flex:1;min-height:0}
    .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:24px}
    .screen::-webkit-scrollbar{display:none}
    .screen.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
    .screen.enter-back{animation:enterBack .28s cubic-bezier(.2,.8,.2,1)}
    .screen.fade{animation:fade .2s ease}
    @keyframes enter{from{transform:translateX(30px);opacity:0}}
    @keyframes enterBack{from{transform:translateX(-30px);opacity:0}}
    @keyframes fade{from{opacity:0}}
    .screen.no-scroll{overflow:hidden;padding-bottom:0}

    .tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:6px 12px 22px;background:var(--surface)}
    .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
    .tab svg{width:24px;height:24px}
    .tab.on{color:var(--accent)}
    .tab .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

    /* ---------- common ui ---------- */
    .top{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;min-height:48px}
    .top h2{font-size:17px;font-weight:800;margin:0;flex:1;text-align:center}
    .iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--surface-2);flex:none}
    .iconbtn svg{width:20px;height:20px}
    .iconbtn.ghost{background:none}
    .pad{padding:0 16px}
    .h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:16px;font-weight:800;font-size:15px;background:var(--accent);color:var(--on-accent);transition:transform .12s, opacity .2s}
    .btn:active{transform:scale(.98)}
    .btn[disabled]{opacity:.35;pointer-events:none}
    .btn.block{width:100%}
    .btn.soft{background:var(--surface-2);color:var(--ink)}
    .btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:13px}
    .chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--surface-2);font-weight:700;font-size:13px;white-space:nowrap}
    .chip.on{background:var(--ink);color:var(--surface)}
    .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
    .dot.sun{background:var(--sun)} .dot.mint{background:var(--mint)}
    .ph{display:block;width:100%;height:100%;border-radius:inherit}
    .ph svg{display:block;width:100%;height:100%;border-radius:inherit}
    .bottom-bar{position:sticky;bottom:0;padding:12px 16px 4px;background:linear-gradient(to top,var(--surface) 70%,transparent);margin-top:8px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:13px;font-weight:700;color:var(--muted)}
    .input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s}
    .input:focus{border-color:var(--accent)}
    textarea.input{resize:none;min-height:88px;line-height:1.4}

    /* ---------- inbox ---------- */
    .hello{padding:4px 16px 18px;display:flex;flex-direction:column;gap:6px}
    .pile{margin:0 16px 14px;border-radius:24px;background:var(--surface-2);padding:16px;display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;text-align:left;width:calc(100% - 32px);transition:transform .15s}
    .pile:active{transform:scale(.985)}
    .fan{position:relative;height:112px}
    .fan .f{position:absolute;width:78px;height:96px;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.18);border:3px solid var(--surface);top:8px;left:18px}
    .fan .f:nth-child(1){transform:rotate(-12deg) translate(-14px,4px)}
    .fan .f:nth-child(2){transform:rotate(9deg) translate(16px,2px)}
    .fan .f:nth-child(3){transform:rotate(-2deg)}
    .pile .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
    .pile .ttl{font-weight:800;font-size:16px}
    .pile .count{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
    .pile .count small{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted);margin-left:4px}
    .hint{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;align-self:flex-start}
    .hint.sun{background:var(--sun-soft);color:var(--ink)} .hint.mint{background:var(--mint-soft);color:var(--ink)} .hint.grey{background:var(--surface-3)}
    .cloud{position:relative;height:150px;margin:0 16px 18px}
    .cloud .c{position:absolute;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);animation:float 6s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-5px)}}
    .empty{margin:30px 16px;padding:28px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:24px;display:flex;flex-direction:column;gap:10px;align-items:center}

    /* ---------- select grid ---------- */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px}
    .tile{position:relative;aspect-ratio:1;max-width:100%;overflow:hidden;border-radius:4px}
    .tile .ph{transition:transform .15s}
    .tile.sel .ph{transform:scale(.88);border-radius:10px}
    .tile .tick{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:12px;border:2px solid #fff;background:rgba(0,0,0,.15);display:grid;place-items:center;transition:all .15s}
    .tile.sel .tick{background:var(--accent);border-color:var(--accent)}
    .tile .tick svg{width:14px;height:14px;opacity:0;color:#fff}
    .tile.sel .tick svg{opacity:1}
    .tile .tm{position:absolute;left:6px;bottom:5px;color:#fff;font-family:var(--f-mono);font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
    .selhead{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;gap:12px}

    /* ---------- sheet ---------- */
    .overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
    .overlay .backdrop{position:absolute;inset:0;background:rgba(10,16,20,.45);animation:fade .2s}
    .sheet{position:relative;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 16px 30px;animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
    .sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
    @keyframes up{from{transform:translateY(100%)}}
    .opt{display:grid;grid-template-columns:52px 1fr 20px;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:20px;background:var(--surface-2);margin-top:10px;border:2px solid transparent}
    .opt:hover{border-color:var(--line)}
    .opt .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
    .opt .ic svg{width:26px;height:26px}
    .opt b{display:block;font-size:16px;font-weight:800}
    .opt span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}

    /* ---------- place picker ---------- */
    .minimap{position:relative;height:190px;margin:0 16px;border-radius:22px;overflow:hidden;background:var(--map-land)}
    .minimap .inner{position:absolute;left:0;top:0;width:800px;height:1000px}
    .geo{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,85,245,.45)}100%{box-shadow:0 0 0 22px rgba(45,85,245,0)}}
    .geo-label{position:absolute;top:12px;left:12px;background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
    .search{position:relative;margin:14px 16px 6px}
    .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
    .search .input{padding-left:42px;background:var(--surface-2);border-color:transparent}
    .plist{display:flex;flex-direction:column;padding:0 8px}
    .prow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 8px;border-radius:16px;width:100%}
    .prow:hover{background:var(--surface-2)}
    .prow .pi{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center}
    .prow .pi svg{width:22px;height:22px}
    .prow b{display:block;font-weight:800}
    .prow small{display:block;color:var(--muted);font-size:13px}
    .prow .tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--mint-soft);color:var(--ink);white-space:nowrap}
    .sect{padding:14px 16px 6px}

    /* ---------- event form ---------- */
    .strip{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
    .strip::-webkit-scrollbar{display:none}
    .strip .s{flex:none;width:72px;height:72px;border-radius:14px;overflow:hidden;position:relative}
    .strip .s.cover{outline:3px solid var(--accent);outline-offset:-3px}
    .strip .s .cv{position:absolute;left:4px;bottom:4px;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:800;border-radius:6px;padding:2px 5px}
    .form{display:flex;flex-direction:column;gap:18px;padding:18px 16px 0}
    .placecard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface-2);text-align:left;width:100%}
    .placecard .pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sun-soft)}
    .placecard .pi svg{width:22px;height:22px}
    .datecard{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface-2)}

    /* ---------- success ---------- */
    .success{position:absolute;inset:0;z-index:40;background:var(--surface);display:flex;flex-direction:column;padding:40px 24px 30px;gap:16px;animation:fade .25s}
    .success .burst{width:84px;height:84px;border-radius:28px;background:var(--mint);display:grid;place-items:center;color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
    .success .burst svg{width:42px;height:42px}
    @keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
    .resultcard{border-radius:24px;overflow:hidden;background:var(--surface-2)}
    .resultcard .cov{height:150px;position:relative}
    .resultcard .cov .ph{border-radius:0}
    .resultcard .rc{padding:14px 16px;display:flex;flex-direction:column;gap:4px}

    /* ---------- map ---------- */
    .map-vp{position:absolute;inset:0;overflow:hidden;background:var(--map-land);touch-action:none;cursor:grab}
    .map-vp.drag{cursor:grabbing}
    .map-canvas{position:absolute;left:0;top:0;width:800px;height:1000px;will-change:transform}
    .map-canvas.anim{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
    .m-land{fill:var(--map-land)} .m-block{fill:var(--map-block)} .m-road{stroke:var(--map-road);fill:none;stroke-linecap:round} .m-water{stroke:var(--map-water);fill:none;stroke-linecap:round} .m-waterf{fill:var(--map-water)} .m-park{fill:var(--map-park)}
    .m-label{fill:var(--map-label);font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
    .pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:transform .2s;z-index:2}
    .pin .bub{width:54px;height:54px;border-radius:16px;padding:3px;background:var(--sun);box-shadow:0 6px 16px rgba(0,0,0,.25);position:relative}
    .pin.place .bub{background:var(--mint);border-radius:27px}
    .pin .bub .ph{border-radius:13px;overflow:hidden}
    .pin.place .bub .ph{border-radius:24px}
    .pin .stem{width:3px;height:10px;background:var(--sun);border-radius:2px}
    .pin.place .stem{background:var(--mint)}
    .pin .cnt{position:absolute;top:-8px;right:-8px;background:var(--ink);color:var(--surface);font-size:11px;font-weight:800;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
    .pin.focus{transform:translate(-50%,-100%) scale(1.15);z-index:3}
    .pin.focus .bub{box-shadow:0 0 0 5px var(--surface),0 0 0 8px var(--accent),0 10px 20px rgba(0,0,0,.25)}
    .pin .nm{margin-top:4px;background:var(--surface);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
    .map-top{position:absolute;left:0;right:0;top:0;padding:8px 16px;display:flex;flex-direction:column;gap:10px;z-index:5;pointer-events:none}
    .map-top>*{pointer-events:auto}
    .map-top .chip{box-shadow:var(--shadow);background:var(--surface)}
    .map-top .chip.on{background:var(--ink);color:var(--surface)}
    .map-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .map-title .ttl{background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:16px}
    .legend{position:absolute;left:16px;bottom:14px;z-index:5;background:var(--surface);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:12px;font-weight:700;display:flex;gap:12px}
    .legend span{display:flex;align-items:center;gap:6px}
    .locate{position:absolute;right:16px;bottom:14px;z-index:5;background:var(--surface);box-shadow:var(--shadow)}

    /* pin sheet / cards */
    .card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface-2);text-align:left;width:100%}
    .card .th{width:64px;height:64px;border-radius:14px;overflow:hidden}
    .card b{display:block;font-weight:800;font-size:15px}
    .card small{display:block;color:var(--muted);font-size:13px}
    .kind{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
    .stack{display:flex;flex-direction:column;gap:8px}

    /* ---------- calendar ---------- */
    .calhead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px}
    .calhead .h1{font-size:22px}
    .wd{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;font-size:11px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.04em}
    .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 12px 0}
    .day{aspect-ratio:1;max-width:100%;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
    .day.out{opacity:.3}
    .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
    .day.has{color:#fff}
    .day.has .ph{position:absolute;inset:0;border-radius:0}
    .day.has::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 60%)}
    .day.has span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.5)}
    .day .mk{position:absolute;right:4px;bottom:4px;z-index:1;display:flex;gap:2px}
    .day .mk i{width:7px;height:7px;border-radius:50%;border:1.5px solid #fff}
    .day.picked{outline:3px solid var(--ink);outline-offset:1px}
    .daylist{padding:16px 16px 0;display:flex;flex-direction:column;gap:8px}

    /* ---------- detail ---------- */
    .hero{position:relative;height:270px;margin-top:-44px}
    .hero .ph{border-radius:0}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 35%,transparent 55%,rgba(0,0,0,.55))}
    .hero .tb{position:absolute;top:50px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
    .hero .tb .iconbtn{background:rgba(255,255,255,.9);color:#13202A}
    .hero .ht{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;color:#fff}
    .hero .ht .h1{color:#fff}
    .facts{display:flex;flex-direction:column;gap:8px;padding:16px}
    .fact{display:flex;gap:12px;align-items:center;font-weight:700;text-align:left}
    .fact .fi{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
    .fact .fi svg{width:19px;height:19px}

let drag=null,dragMoved=false;
function clampPos(x,y,vp){return [Math.min(0,Math.max(vp.clientWidth-800,x)),Math.min(0,Math.max(vp.clientHeight-1000,y))]}
function setPos(x,y,anim){const vp=$("#vp"),c=$("#canvas");if(!vp)return;[x,y]=clampPos(x,y,vp);S.map.x=x;S.map.y=y;c.classList.toggle("anim",!!anim);c.style.transform=`translate(${x}px,${y}px)`}
function centerOn(px,py,anim){const vp=$("#vp");setPos(vp.clientWidth/2-px,vp.clientHeight/2-py+40,anim)}
function mountMap(){
  const vp=$("#vp");
  if(S.focus&&places[S.focus])centerOn(places[S.focus].x,places[S.focus].y,false);
  else if(S.map.x!==null)setPos(S.map.x,S.map.y,false);else centerOn(430,560,false);
  vp.addEventListener("pointerdown",e=>{drag={sx:e.clientX,sy:e.clientY,x:S.map.x,y:S.map.y,id:e.pointerId};dragMoved=false});
  vp.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!dragMoved&&Math.hypot(dx,dy)>5){dragMoved=true;vp.classList.add("drag");try{vp.setPointerCapture(drag.id)}catch(_){}}if(dragMoved)setPos(drag.x+dx,drag.y+dy,false)});
  const end=()=>{if(drag&&dragMoved)log("Карта: перемещение");drag=null;vp.classList.remove("drag")};
  vp.addEventListener("pointerup",end);vp.addEventListener("pointercancel",end);
}
function mountMini(){const P=PILES[S.pile],m=$("#mini"),inn=$("#miniInner");inn.style.transform=`translate(${m.clientWidth/2-P.geo[0]}px,${m.clientHeight/2-P.geo[1]+20}px)`}

/* ---------------- sheets ---------------- */
function sheet(html){$("#layer").innerHTML=`<div class="overlay"><div class="backdrop" data-act="closelayer"></div><div class="sheet"><div class="grab"></div>${html}</div></div>`}
function actionSheet(){
  sheet(`<div class="eyebrow">${S.sel.size} ${plural(S.sel.size,"фото выбрано","фото выбрано","фото выбрано")}</div><h3 class="h1" style="font-size:22px;margin:6px 0 4px">Как сохранить эти фото?</h3>
  <button class="opt" data-act="mode" data-m="event"><span class="ic" style="background:var(--sun-soft);color:var(--ink)">${I.star}</span><span><b>Создать событие</b><span>Для праздников, встреч, поездок. Место + название + описание</span></span>${I.chev}</button>
  <button class="opt" data-act="mode" data-m="place"><span class="ic" style="background:var(--mint-soft);color:var(--ink)">${I.pin}</span><span><b>Только привязать к месту</b><span>Для кофейни, парка, любимых мест. Фото просто появятся на карте</span></span>${I.chev}</button>`);
  log("Открыт выбор: событие / место");
}
function pinSheet(pid){
  const pl=places[pid],its=itemsAt(pid).sort((a,b)=>a.date<b.date?1:-1),visits=its.filter(i=>i.type==="visit");
  sheet(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h3 class="h1" style="font-size:20px">${esc(pl.name)}</h3><div class="muted" style="margin-top:2px">${esc(pl.addr)}</div></div><button class="iconbtn" data-act="closelayer" aria-label="Закрыть">${I.close}</button></div>
  <div class="stack" style="margin-top:14px">${its.filter(i=>i.type==="event").map(cardHTML).join("")}
  ${visits.length?`<button class="card" data-act="openplace" data-id="${pid}"><span class="th">${phSVG(photos[visits[0].photos[0]])}</span><span><span class="kind" style="color:var(--mint)"><span class="dot mint"></span>Место</span><b>${visits.length} ${plural(visits.length,"визит","визита","визитов")} · ${visits.reduce((a,v)=>a+v.photos.length,0)} фото</b><small>последний: ${fmt(visits[0].date)}</small></span><span class="muted">${I.chev}</span></button>`:""}</div>`);
  log("Карта: открыта метка "+pl.name);
}
function placeConfirm(){
  const pl=places[S.placeId],sel=[...S.sel],P=PILES[S.pile],prev=itemsAt(S.placeId).filter(i=>i.type==="visit").length;
  sheet(`<div class="eyebrow">Привязка к месту</div><h3 class="h1" style="font-size:22px;margin:6px 0 12px">${esc(pl.name)}</h3>
  <div class="strip" style="padding:0 0 10px">${sel.map(id=>`<span class="s">${phSVG(photos[id])}</span>`).join("")}</div>
  <div class="datecard" style="margin-bottom:10px"><span style="font-weight:800">${cap(wday(P.date))}, ${fmt(P.date)}</span><span class="mono muted">${sel.length} фото</span></div>
  ${prev?`<p class="muted" style="margin:0 0 12px">Это будет ваш ${prev+1}-й визит сюда. Фото лягут в общую ленту места.</p>`:`<p class="muted" style="margin:0 0 12px">Место появится на карте. Событие создавать не нужно.</p>`}
  <div class="field" style="margin-bottom:14px"><label for="vnote">Заметка · по желанию</label><input class="input" id="vnote" placeholder="Например, новый сезонный раф" autocomplete="off"></div>
  <button class="btn block" data-act="saveplace">Привязать к месту</button>`);
}
function success(item){
  const pl=places[item.placeId],ev=item.type==="event";
  $("#layer").innerHTML=`<div class="success"><div class="burst">${I.check}</div><h2 class="h1">${ev?"Событие сохранено":"Фото привязаны к месту"}</h2><p class="muted" style="margin:0">${ev?"Оно уже на карте и в календаре.":"Они появились на карте рядом с отметкой места."}</p>
  <div class="resultcard"><div class="cov">${phSVG(photos[item.cover||item.photos[0]])}</div><div class="rc"><span class="kind" style="color:var(--${ev?"sun":"mint"})"><span class="dot ${ev?"sun":"mint"}"></span>${ev?"Событие":"Место"}</span><b style="font-size:17px">${esc(ev?item.title:pl.name)}</b><span class="muted" style="font-size:13px">${fmt(item.date)} · ${esc(pl.name)} · ${item.photos.length} фото</span></div></div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px"><button class="btn block" data-act="succmap">${I.map.replace("<svg",'<svg width="20" height="20"')}Посмотреть на карте</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn soft" data-act="succcal">В календаре</button><button class="btn soft" data-act="succmore">Ещё фото</button></div></div></div>`;
}
let LB=null;
function lightbox(listId,i){const it=items.find(x=>x.id===listId);LB={ids:it.photos,i};drawLB();log("Просмотр фото")}
function drawLB(){const p=photos[LB.ids[LB.i]];$("#layer").innerHTML=`<div class="lightbox"><div class="lb-top"><button class="iconbtn" data-act="closelayer" aria-label="Закрыть">${I.close}</button><span class="mono">${LB.i+1} / ${LB.ids.length} · ${fmt(p.date)}, ${p.time}</span><span style="width:40px"></span></div><div class="lb-img">${phSVG(p)}</div><div style="display:flex;justify-content:center;gap:16px;padding-bottom:36px"><button class="iconbtn" data-act="lbprev" aria-label="Предыдущее">${I.back}</button><button class="iconbtn" data-act="lbnext" aria-label="Следующее" style="transform:scaleX(-1)">${I.back}</button></div></div>`}

/* ---------------- actions ---------------- */
function save(item){item.photos.forEach(id=>photos[id].assigned=item.id);items.push(item);S.lastSaved=item;S.sel=new Set();S.form={title:"",desc:"",cover:null};S.query="";success(item);render()}
$("#app").addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  switch(a){
    case "tab":closeLayer();S.focus=null;go(t.dataset.v);break;
    case "back":back();break;
    case "closelayer":closeLayer();break;
    case "pile":S.pile=t.dataset.k;S.sel=new Set();go("select",{label:PILES[S.pile].title});break;
    case "toggle":{const id=t.dataset.id;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);t.classList.toggle("sel");t.setAttribute("aria-pressed",S.sel.has(id));const b=$("#nextbtn");b.disabled=!S.sel.size;b.textContent=S.sel.size?`Привязать ${S.sel.size} ${plural(S.sel.size,"фото","фото","фото")} к месту`:"Выберите фото";const all=pilePhotos(S.pile).every(p=>S.sel.has(p.id));const c=document.querySelector('[data-act="selall"]');c.classList.toggle("on",all);c.textContent=all?"Снять всё":"Выбрать все";break}
    case "selall":{const ps=pilePhotos(S.pile);const all=ps.every(p=>S.sel.has(p.id));ps.forEach(p=>all?S.sel.delete(p.id):S.sel.add(p.id));log(all?"Снят выбор":"Выбраны все фото");const st=$("#screen").scrollTop;render();$("#screen").scrollTop=st;break}
    case "next":log(`Выбрано фото: ${S.sel.size}`);actionSheet();break;
    case "mode":S.mode=t.dataset.m;closeLayer();log("Выбран тип: "+(S.mode==="event"?"событие":"только место"));S.query="";go("place");break;
    case "pickplace":case "pickgeo":{
      if(a==="pickgeo"){const P=PILES[S.pile],id="pt"+Date.now();places[id]={name:"Отмеченная точка",addr:"по геометке фото",x:P.geo[0],y:P.geo[1],cat:"Точка"};S.placeId=id}else S.placeId=t.dataset.id;
      log("Выбрано место: "+places[S.placeId].name);
      if(S.mode==="event")go("form");else placeConfirm();break}
    case "sug":S.form.title=t.dataset.s;$("#ftitle").value=S.form.title;$("#savebtn").disabled=false;log("Подсказка названия: "+t.dataset.s);break;
    case "cover":S.form.cover=t.dataset.id;document.querySelectorAll(".strip .s").forEach(s=>{const on=s.dataset.id===S.form.cover;s.classList.toggle("cover",on);const cv=s.querySelector(".cv");if(cv&&!on)cv.remove();if(on&&!cv)s.insertAdjacentHTML("beforeend",'<span class="cv">ОБЛОЖКА</span>')});break;
    case "saveevent":{const sel=[...S.sel],times=sel.map(id=>photos[id].time).sort();const it={id:"e"+Date.now(),type:"event",title:S.form.title.trim(),desc:S.form.desc.trim(),placeId:S.placeId,date:PILES[S.pile].date,time:times[0]+" – "+times[times.length-1],photos:sel,cover:S.form.cover||sel[0]};log(`Событие сохранено: «${it.title}», ${sel.length} фото`);S.stack=[];S.view="inbox";S.tab="inbox";save(it);break}
    case "saveplace":{const sel=[...S.sel];const it={id:"v"+Date.now(),type:"visit",placeId:S.placeId,date:PILES[S.pile].date,time:sel.map(id=>photos[id].time).sort()[0],photos:sel,note:($("#vnote")||{}).value||""};log(`Фото привязаны к месту: ${places[S.placeId].name}, ${sel.length} фото`);S.stack=[];S.view="inbox";S.tab="inbox";save(it);break}
    case "succmap":closeLayer();S.focus=S.lastSaved.placeId;S.mapFilter="all";go("map");setTimeout(()=>toast(S.lastSaved.type==="event"?"Новое событие отмечено на карте":"Фото добавлены к метке места"),300);break;
    case "succcal":closeLayer();{const d=pd(S.lastSaved.date);S.cal={y:d.getFullYear(),m:d.getMonth()};S.calDay=S.lastSaved.date}go("calendar");break;
    case "succmore":closeLayer();go("inbox");break;
    case "filter":S.mapFilter=t.dataset.f;S.focus=null;log("Фильтр карты: "+t.textContent.trim());render();break;
    case "recenter":S.focus=null;centerOn(430,560,true);break;
    case "pin":if(dragMoved){dragMoved=false;return}S.focus=t.dataset.id;document.querySelectorAll(".pin").forEach(p=>p.classList.toggle("focus",p===t));pinSheet(t.dataset.id);break;
    case "openevent":closeLayer();go("event",{id:t.dataset.id,label:items.find(i=>i.id===t.dataset.id).title});break;
    case "openplace":closeLayer();go("placeinfo",{id:t.dataset.id,label:places[t.dataset.id].name});break;
    case "showonmap":S.focus=t.dataset.id;go("map");break;
    case "mprev":case "mnext":{let {y,m}=S.cal;m+=a==="mnext"?1:-1;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m};S.calDay=null;log("Календарь: "+MN[m]+" "+y);render("fade");break}
    case "day":{const its=items.filter(i=>i.date===t.dataset.d);if(!its.length)return;S.calDay=t.dataset.d;log("Календарь: выбран "+fmt(S.calDay));const st=$("#screen").scrollTop;render();$("#screen").scrollTop=st;break}
    case "dayclear":S.calDay=null;render();break;
    case "lb":lightbox(t.dataset.list,+t.dataset.i);break;
    case "lbprev":LB.i=(LB.i-1+LB.ids.length)%LB.ids.length;drawLB();break;
    case "lbnext":LB.i=(LB.i+1)%LB.ids.length;drawLB();break;
  }
});
$("#app").addEventListener("input",e=>{
  if(e.target.id==="ftitle"){S.form.title=e.target.value;$("#savebtn").disabled=!S.form.title.trim()}
  if(e.target.id==="fdesc")S.form.desc=e.target.value;
  if(e.target.id==="q"){S.query=e.target.value;const pos=e.target.selectionStart;const list=document.querySelector(".plist");const tmp=document.createElement("div");tmp.innerHTML=VIEWS.place();list.replaceWith(tmp.querySelector(".plist"));document.querySelector(".sect.eyebrow").textContent=S.query.trim()?"Результаты":"Рядом с местом съёмки";e.target.setSelectionRange(pos,pos)}
});

/* ---------------- panel (скрыта, оставлена только для сброса) ---------------- */
function tick(){const now=new Date();$("#clock").textContent=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")}

seed();tick();setInterval(tick,30000);
log("Прототип открыт");render("fade");
})();
</script>
<script>
(function fit(){
  function apply(){
    if (window.innerWidth <= 860) {
      document.querySelector('.device').style.transform = 'none';
      return;
    }
    var d = document.querySelector('.device');
    if (!d) return;
    var pad = 32;
    var scale = Math.min(
      (window.innerWidth  - pad) / 410,
      (window.innerHeight - pad) / 864
    );
    d.style.transform = 'scale(' + Math.min(scale, 1) + ')';
  }
  window.addEventListener('resize', apply);
  window.addEventListener('load', apply);
  apply();
})();
</script>
</body>
